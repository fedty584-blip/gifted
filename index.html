<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเช็คชื่อความสะอาดเวรประจำวัน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <h1 class="text-xl font-bold flex items-center gap-2">
        🧹 ระบบเช็คชื่อเวรทำความสะอาด (34 คน)
      </h1>
      <div class="flex gap-2 bg-indigo-700 p-1 rounded-lg">
        <button id="tabDaily" onclick="switchTab('daily')" class="px-4 py-1.5 rounded-md font-medium text-sm transition bg-white text-indigo-600 shadow">เช็คชื่อรายวัน</button>
        <button id="tabMonthly" onclick="switchTab('monthly')" class="px-4 py-1.5 rounded-md font-medium text-sm transition text-white hover:bg-indigo-600">สถิติประจำเดือน</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6">

    <!-- TAB 1: เช็คชื่อรายวัน -->
    <div id="viewDaily" class="space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <label class="font-medium text-gray-700 text-sm whitespace-nowrap">เลือกวันที่:</label>
          <input type="date" id="checkDate" class="border rounded-lg px-3 py-1.5 text-sm w-full sm:w-auto focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex gap-2 w-full sm:w-auto">
          <button onclick="checkAll(true)" class="flex-1 sm:flex-initial px-3 py-1.5 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-lg text-xs font-medium hover:bg-emerald-100">เลือกทั้งหมด</button>
          <button onclick="checkAll(false)" class="flex-1 sm:flex-initial px-3 py-1.5 bg-rose-50 text-rose-600 border border-rose-200 rounded-lg text-xs font-medium hover:bg-rose-100">ยกเลิกทั้งหมด</button>
        </div>
      </div>

      <!-- รายชื่อนักเรียน 34 คน -->
      <div id="studentList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <!-- JS จะสร้างรายการตรงนี้ -->
      </div>

      <!-- ปุ่มบันทึก -->
      <div class="sticky bottom-4">
        <button onclick="saveData()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-base">
          💾 บันทึกข้อมูลเข้า Google Sheets
        </button>
      </div>
    </div>

    <!-- TAB 2: สถิติรายเดือน -->
    <div id="viewMonthly" class="hidden space-y-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border flex items-center gap-3">
        <label class="font-medium text-gray-700 text-sm">เลือกเดือน/ปี:</label>
        <input type="month" id="monthPicker" onchange="loadMonthlyStats()" class="border rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- สรุปตัวเลข & กราฟ -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white p-5 rounded-xl shadow-sm border flex flex-col justify-center items-center text-center">
          <span class="text-xs text-gray-500 font-medium">ทำเวรสำเร็จภาพรวม</span>
          <span id="statPercent" class="text-3xl font-bold text-indigo-600 mt-1">0%</span>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border md:col-span-2 flex justify-center items-center h-48">
          <canvas id="chartMonthly"></canvas>
        </div>
      </div>

      <!-- ตารางสรุปรายบุคคล -->
      <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100 text-gray-700 border-b">
            <tr>
              <th class="p-3">รหัส</th>
              <th class="p-3">ชื่อ - นามสกุล</th>
              <th class="p-3 text-center">ทำเวร (วัน)</th>
              <th class="p-3 text-center">ร้อยละ (%)</th>
            </tr>
          </thead>
          <tbody id="monthlyTable" class="divide-y">
            <!-- JS จะสร้างตารางตรงนี้ -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    // ⚠️ นำ URL จาก Apps Script (/exec) มาใส่ตรงนี้ครับ
    const API_URL = "https://script.google.com/macros/s/AKfycbw045POHSAmHVLf-2CfaY0DVgZ8Tn7TtdgwKe9HlGRi-1-lhZjkiT1dul5ALIO-h2LT/exec";

    // รายชื่อนักเรียน 34 คน (รหัส 31965-33580)
    const students = [
      { id: 31965, name: "นักเรียนคนที่ 1" }, { id: 31966, name: "นักเรียนคนที่ 2" },
      { id: 31967, name: "นักเรียนคนที่ 3" }, { id: 31968, name: "นักเรียนคนที่ 4" },
      { id: 31969, name: "นักเรียนคนที่ 5" }, { id: 31970, name: "นักเรียนคนที่ 6" },
      { id: 31971, name: "นักเรียนคนที่ 7" }, { id: 31972, name: "นักเรียนคนที่ 8" },
      { id: 31973, name: "นักเรียนคนที่ 9" }, { id: 31974, name: "นักเรียนคนที่ 10" },
      { id: 31975, name: "นักเรียนคนที่ 11" }, { id: 31976, name: "นักเรียนคนที่ 12" },
      { id: 31977, name: "นักเรียนคนที่ 13" }, { id: 31978, name: "นักเรียนคนที่ 14" },
      { id: 31979, name: "นักเรียนคนที่ 15" }, { id: 31980, name: "นักเรียนคนที่ 16" },
      { id: 31981, name: "นักเรียนคนที่ 17" }, { id: 31982, name: "นักเรียนคนที่ 18" },
      { id: 31983, name: "นักเรียนคนที่ 19" }, { id: 31984, name: "นักเรียนคนที่ 20" },
      { id: 31985, name: "นักเรียนคนที่ 21" }, { id: 31986, name: "นักเรียนคนที่ 22" },
      { id: 31987, name: "นักเรียนคนที่ 23" }, { id: 31988, name: "นักเรียนคนที่ 24" },
      { id: 31989, name: "นักเรียนคนที่ 25" }, { id: 31990, name: "นักเรียนคนที่ 26" },
      { id: 31991, name: "นักเรียนคนที่ 27" }, { id: 31992, name: "นักเรียนคนที่ 28" },
      { id: 31993, name: "นักเรียนคนที่ 29" }, { id: 31994, name: "นักเรียนคนที่ 30" },
      { id: 31995, name: "นักเรียนคนที่ 31" }, { id: 31996, name: "นักเรียนคนที่ 32" },
      { id: 31997, name: "นักเรียนคนที่ 33" }, { id: 33580, name: "นักเรียนคนที่ 34" }
    ];

    let chartInstance = null;

    // เริ่มต้นระบบ
    window.onload = () => {
      document.getElementById('checkDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('monthPicker').value = new Date().toISOString().slice(0, 7);
      renderDailyList();
    };

    function renderDailyList() {
      const container = document.getElementById('studentList');
      container.innerHTML = students.map((s, idx) => `
        <div class="bg-white p-3.5 rounded-xl shadow-sm border flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-2 py-1 rounded">${s.id}</span>
            <span class="font-medium text-gray-800 text-sm">${s.name}</span>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="check_${s.id}" class="sr-only peer">
            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
          </label>
        </div>
      `).join('');
    }

    function checkAll(val) {
      students.forEach(s => {
        const el = document.getElementById(`check_${s.id}`);
        if(el) el.checked = val;
      });
    }

    function switchTab(tab) {
      if(tab === 'daily') {
        document.getElementById('viewDaily').classList.remove('hidden');
        document.getElementById('viewMonthly').classList.add('hidden');
        document.getElementById('tabDaily').className = "px-4 py-1.5 rounded-md font-medium text-sm transition bg-white text-indigo-600 shadow";
        document.getElementById('tabMonthly').className = "px-4 py-1.5 rounded-md font-medium text-sm transition text-white hover:bg-indigo-600";
      } else {
        document.getElementById('viewDaily').classList.add('hidden');
        document.getElementById('viewMonthly').classList.remove('hidden');
        document.getElementById('tabMonthly').className = "px-4 py-1.5 rounded-md font-medium text-sm transition bg-white text-indigo-600 shadow";
        document.getElementById('tabDaily').className = "px-4 py-1.5 rounded-md font-medium text-sm transition text-white hover:bg-indigo-600";
        loadMonthlyStats();
      }
    }

    async function saveData() {
      const date = document.getElementById('checkDate').value;
      if(!date) return alert('กรุณาเลือกวันที่');

      const records = students.map(s => ({
        studentId: s.id,
        studentName: s.name,
        checked: document.getElementById(`check_${s.id}`).checked
      }));

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ date, records })
        });
        alert('✅ บันทึกข้อมูลเข้า Google Sheets เรียบร้อยครับ!');
      } catch(e) {
        alert('❌ บันทึกไม่สำเร็จ โปรดตรวจสอบการตั้งค่า URL');
      }
    }

    async function loadMonthlyStats() {
      const month = document.getElementById('monthPicker').value; // YYYY-MM
      try {
        const res = await fetch(API_URL);
        const allData = await res.json();
        
        // กรองเฉพาะเดือนที่เลือก
        const monthData = allData.filter(d => d.date && d.date.startsWith(month));
        
        let stats = {};
        students.forEach(s => stats[s.id] = { name: s.name, done: 0, total: 0 });

        monthData.forEach(d => {
          if(stats[d.studentId]) {
            stats[d.studentId].total++;
            if(d.status === 'ทำเวรแล้ว') stats[d.studentId].done++;
          }
        });

        // ตารางสรุป
        let totalDoneAll = 0, totalDaysAll = 0;
        const tbody = document.getElementById('monthlyTable');
        tbody.innerHTML = students.map(s => {
          const st = stats[s.id];
          const pct = st.total > 0 ? Math.round((st.done / st.total) * 100) : 0;
          totalDoneAll += st.done;
          totalDaysAll += st.total;
          return `
            <tr class="hover:bg-slate-50">
              <td class="p-3 text-gray-500 font-mono text-xs">${s.id}</td>
              <td class="p-3 font-medium text-gray-800">${s.name}</td>
              <td class="p-3 text-center">${st.done}</td>
              <td class="p-3 text-center font-bold text-indigo-600">${pct}%</td>
            </tr>
          `;
        }).join('');

        const avgPct = totalDaysAll > 0 ? Math.round((totalDoneAll / totalDaysAll) * 100) : 0;
        document.getElementById('statPercent').innerText = `${avgPct}%`;

        // แสดงกราฟ
        renderChart(totalDoneAll, totalDaysAll - totalDoneAll);

      } catch(e) {
        console.error(e);
      }
    }

    function renderChart(done, notDone) {
      const ctx = document.getElementById('chartMonthly').getContext('2d');
      if(chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['ทำเวรแล้ว', 'ยังไม่ได้ทำ'],
          datasets: [{
            data: [done, notDone],
            backgroundColor: ['#10B981', '#F43F5E']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }
  </script>
</body>
</html>
